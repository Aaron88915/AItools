<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Nav · 全球 AI 工具导航</title>
  <meta name="description" content="收录全球 280+ AI 工具的导航站，分类齐全，支持模糊搜索。涵盖聊天、绘画、视频、写作、代码、办公、设计等全部主流方向。">
  <meta name="keywords" content="AI 工具,AI 导航,AI 工具大全,ChatGPT,Midjourney,Sora,Claude,DeepSeek,通义千问,文心一言,AI 写作,AI 绘画,AI 编程">
  <meta name="theme-color" content="#0B1020">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SKES4GTDCS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SKES4GTDCS');
  </script>
  <!-- Google AdSense（占位 ID；拿到 ca-pub 后替换） -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
          crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=8">
  <link rel="stylesheet" href="styles.css?v=8">
  <!-- Fuse.js 模糊搜索（CDN,GitHub Pages 可直接访问） -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body>
  <!-- 顶部背景光晕 -->
  <div class="bg-glow" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="site-header">
    <div class="brand">
      <img src="logo.svg" alt="AI Nav" class="brand-logo">
      <div class="brand-text">
        <h1>AI Nav</h1>
        <p class="brand-sub">全球 AI 工具导航 · 持续更新</p>
      </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input
        id="search"
        type="search"
        placeholder="搜索工具名、关键词、分类…   如：gpt、绘画、国产、代码"
        autocomplete="off"
        spellcheck="false"
      >
      <kbd class="search-kbd">/</kbd>
    </div>

    <!-- 统计 -->
    <div class="header-stats">
      <span><b id="stat-total">0</b> 个工具</span>
      <span><b id="stat-cat">0</b> 个分类</span>
    </div>
  </header>

  <!-- 顶部广告位（待激活） -->
  <div class="ad-slot ad-banner">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="0000000000"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="ad-placeholder">广告位（AdSense 待激活）</div>
  </div>

  <!-- 主体 + 右侧分类栏（桌面端两栏，移动端单栏） -->
  <div class="layout">
    <!-- 主体内容 -->
    <main id="content" class="content">
      <!-- 分类区块由 JS 注入 -->
    </main>

    <!-- 右侧分类导航 -->
    <aside class="cat-sidebar" aria-label="分类筛选">
      <div class="cat-sidebar-inner">
        <div class="cat-sidebar-title">分类</div>
        <nav class="cat-nav" id="catNav">
          <button class="cat-chip active" data-cat="all">全部</button>
          <!-- 分类按钮由 JS 注入 -->
        </nav>
      </div>
    </aside>
  </div>

  <!-- 空状态 -->
  <div id="empty" class="empty" hidden>
    <div class="empty-icon">🛰️</div>
    <h2>没找到匹配的工具</h2>
    <p>试试别的关键词，或者<a href="#" id="resetLink">查看全部</a></p>
  </div>

  <!-- 底部广告位（待激活） -->
  <div class="ad-slot ad-banner ad-bottom">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="0000000000"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    <div class="ad-placeholder">广告位（AdSense 待激活）</div>
  </div>

  <footer class="site-footer">
    <p>© <span id="year"></span> AI Nav · 收录于互联网公开信息，工具归各自作者所有</p>
    <p class="muted">本站仅作导航整理，不对第三方服务承担责任 · <a href="https://github.com/" target="_blank" rel="noopener">GitHub Pages 托管</a></p>
  </footer>

  <!-- 数据 + 逻辑 -->
  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
