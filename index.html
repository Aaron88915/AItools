<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-html-title="siteTitle">AI Nav · 全球 AI 工具导航</title>
  <meta name="description" data-i18n-content="siteDesc" content="收录全球 280+ AI 工具的导航站，分类齐全，支持模糊搜索。涵盖聊天、绘画、视频、写作、代码、办公、设计等全部主流方向。">
  <meta name="keywords" data-i18n-content="siteKeywords" content="AI 工具,AI 导航,AI 工具大全,ChatGPT,Midjourney,Sora,Claude,DeepSeek,通义千问,文心一言,AI 写作,AI 绘画,AI 编程">
  <meta name="theme-color" content="#0B1020">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SKES4GTDCS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SKES4GTDCS');
  </script>
  <!-- Google AdSense Auto Ads（ca-pub 占位，拿到真 ID 后 sed 替换） -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
          crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=13">
  <link rel="stylesheet" href="styles.css?v=13">
  <!-- Fuse.js 模糊搜索（CDN，GitHub Pages 可直接访问） -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <!-- i18n（必须在 data.js / app.js 之前；首次访问按浏览器语言自动加载） -->
  <script src="i18n.js?v=13"></script>
</head>
<body>
  <!-- Google AdSense Auto Ads 激活（让 AdSense 自动选位置插入；移动端约 7 个、桌面端约 6 个） -->
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({
      google_ad_client: "ca-pub-XXXXXXXXXXXXXXXX",
      enable_page_level_ads: true
    });
  </script>

  <!-- 顶部背景光晕 -->
  <div class="bg-glow" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="site-header">
    <div class="brand">
      <img src="logo.svg" alt="AI Nav" class="brand-logo">
      <div class="brand-text">
        <h1>AI Nav</h1>
        <p class="brand-sub" data-i18n="brandSub">全球 AI 工具导航 · 持续更新</p>
      </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input
        id="search"
        type="search"
        data-i18n-placeholder="placeholder"
        placeholder="搜索工具名、关键词、分类…   如：gpt、绘画、国产、代码"
        autocomplete="off"
        spellcheck="false"
      >
      <kbd class="search-kbd">/</kbd>
    </div>

    <!-- 统计 + 语言切换 -->
    <div class="header-right">
      <div class="header-stats">
        <span><b id="stat-total">0</b> <span data-i18n="statTools">个工具</span></span>
        <span><b id="stat-cat">0</b> <span data-i18n="statCats">个分类</span></span>
      </div>
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button class="lang-btn" data-lang="zh" type="button" title="简体中文">中</button>
        <button class="lang-btn" data-lang="en" type="button" title="English">EN</button>
      </div>
    </div>
  </header>

  <!-- 主体 + 右侧分类栏（桌面端两栏，移动端单栏） -->
  <div class="layout">
    <!-- 主体内容 -->
    <main id="content" class="content">
      <!-- 分类区块由 JS 注入 -->
    </main>

    <!-- 右侧分类导航 -->
    <aside class="cat-sidebar" aria-label="分类筛选">
      <div class="cat-sidebar-inner">
        <div class="cat-sidebar-title" data-i18n="catAll">分类</div>
        <nav class="cat-nav" id="catNav">
          <!-- 分类按钮由 JS 注入 -->
        </nav>
      </div>
    </aside>
  </div>

  <!-- 空状态 -->
  <div id="empty" class="empty" hidden>
    <div class="empty-icon">🛰️</div>
    <h2 data-i18n="emptyTitle">没找到匹配的工具</h2>
    <p><span data-i18n="emptyDesc">试试别的关键词，或者</span><a href="#" id="resetLink" data-i18n="emptyReset">查看全部</a></p>
  </div>

  <footer class="site-footer">
    <p>© <span id="year"></span> AI Nav · <span data-i18n="footerCopyright">收录于互联网公开信息，工具归各自作者所有</span></p>
    <p class="muted"><span data-i18n="footerNote">本站仅作导航整理</span> · <a href="./about.html" data-i18n="footerAbout">关于</a> · <a href="./privacy.html" data-i18n="footerPrivacy">隐私政策</a> · <a href="https://github.com/Aaron88915/AItools" target="_blank" rel="noopener" data-i18n="footerGithub">GitHub</a></p>
  </footer>

  <!-- 数据 + 逻辑 -->
  <script src="data.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
