<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI Nav logo">
  <defs>
    <!-- 主题渐变：青蓝 → 紫 -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <!-- 内部光晕 -->
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <!-- 外发光 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B1020" stroke="url(#g1)" stroke-width="2"/>

  <!-- 内层光晕 -->
  <circle cx="32" cy="32" r="22" fill="url(#g2)"/>

  <!-- 神经网络节点（科技感核心元素） -->
  <g filter="url(#glow)" stroke="url(#g1)" stroke-width="1.2" fill="none">
    <!-- 节点连线 -->
    <line x1="20" y1="22" x2="32" y2="32"/>
    <line x1="44" y1="22" x2="32" y2="32"/>
    <line x1="20" y1="42" x2="32" y2="32"/>
    <line x1="44" y1="42" x2="32" y2="32"/>
    <line x1="20" y1="22" x2="20" y2="42"/>
    <line x1="44" y1="22" x2="44" y2="42"/>
  </g>

  <!-- 节点圆点 -->
  <g fill="url(#g1)">
    <circle cx="32" cy="32" r="3.2"/>
    <circle cx="20" cy="22" r="2.2"/>
    <circle cx="44" cy="22" r="2.2"/>
    <circle cx="20" cy="42" r="2.2"/>
    <circle cx="44" cy="42" r="2.2"/>
  </g>

  <!-- 中心高亮 -->
  <circle cx="32" cy="32" r="1.4" fill="#FFFFFF" opacity="0.9"/>
</svg>
